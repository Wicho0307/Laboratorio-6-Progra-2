openapi: 3.1.0
info:
  title: API de libros de biblioteca
  version: 1.0.0
  description: Diseño del API solicitado en el ejercicio 1 e implementado en el ejercicio 4 del Laboratorio 6.
servers:
  - url: http://localhost:8081
    description: Servidor local
tags:
  - name: Libros
    description: Administración de libros de la biblioteca
paths:
  /api/libros:
    post:
      tags: [Libros]
      summary: Registrar un libro
      operationId: registrarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '201':
          description: Libro registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe un libro con el mismo ISBN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Libros]
      summary: Consultar todos los libros
      operationId: consultarLibros
      responses:
        '200':
          description: Lista de libros obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaLibrosResponse'
  /api/libros/titulo/{titulo}:
    get:
      tags: [Libros]
      summary: Consultar un libro por título
      operationId: consultarLibroPorTitulo
      parameters:
        - name: titulo
          in: path
          required: true
          description: Título exacto del libro
          schema:
            type: string
          example: Cien años de soledad
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '404':
          description: Libro no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/libros/{id}:
    put:
      tags: [Libros]
      summary: Actualizar completamente un libro
      operationId: actualizarLibro
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Libro no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe otro libro con el mismo ISBN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Libros]
      summary: Eliminar un libro
      operationId: eliminarLibro
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Libro eliminado correctamente
        '404':
          description: Libro no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador del libro
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    EstadoLibro:
      type: string
      enum: [DISPONIBLE, PRESTADO, INACTIVO]
    LibroRequest:
      type: object
      required: [titulo, autor, isbn, anioPublicacion, estado]
      properties:
        titulo:
          type: string
          maxLength: 150
          example: Cien años de soledad
        autor:
          type: string
          maxLength: 120
          example: Gabriel García Márquez
        isbn:
          type: string
          minLength: 10
          maxLength: 17
          example: '9780307474728'
        anioPublicacion:
          type: integer
          minimum: 1
          maximum: 2100
          example: 1967
        estado:
          $ref: '#/components/schemas/EstadoLibro'
    Libro:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/LibroRequest'
    LibroResponse:
      type: object
      required: [mensaje, datos]
      properties:
        mensaje:
          type: string
          example: Libro registrado correctamente
        datos:
          $ref: '#/components/schemas/Libro'
    ListaLibrosResponse:
      type: object
      required: [mensaje, datos]
      properties:
        mensaje:
          type: string
          example: Lista de libros obtenida correctamente
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Libro'
    ApiError:
      type: object
      required: [fecha, codigo, error, mensaje, ruta, validaciones]
      properties:
        fecha:
          type: string
          format: date-time
        codigo:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        mensaje:
          type: string
          example: No existe un libro con id: 99
        ruta:
          type: string
          example: /api/libros/99
        validaciones:
          type: object
          additionalProperties:
            type: string
