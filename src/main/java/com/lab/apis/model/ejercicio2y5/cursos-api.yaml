openapi: 3.1.0
info:
  title: API de cursos universitarios
  version: 1.0.0
  description: Diseño del API solicitado en el ejercicio 2 e implementado en el ejercicio 5 del Laboratorio 6.
servers:
  - url: http://localhost:8081
    description: Servidor local
tags:
  - name: Cursos
    description: Administración de cursos universitarios
paths:
  /api/cursos:
    post:
      tags: [Cursos]
      summary: Crear un curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '201':
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe un curso con el mismo código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Cursos]
      summary: Consultar todos los cursos
      operationId: consultarCursos
      responses:
        '200':
          description: Lista de cursos obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCursosResponse'
  /api/cursos/codigo/{codigo}:
    get:
      tags: [Cursos]
      summary: Consultar un curso por código
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código único del curso
          schema:
            type: string
          example: CC-202
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/cursos/{id}:
    put:
      tags: [Cursos]
      summary: Actualizar completamente un curso
      operationId: actualizarCurso
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe otro curso con el mismo código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Cursos]
      summary: Eliminar un curso
      operationId: eliminarCurso
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Curso eliminado correctamente
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador del curso
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    EstadoCurso:
      type: string
      enum: [ACTIVO, INACTIVO]
    CursoRequest:
      type: object
      required: [nombre, codigo, creditos, estado]
      properties:
        nombre:
          type: string
          maxLength: 120
          example: Programación II
        codigo:
          type: string
          maxLength: 20
          example: CC-202
        creditos:
          type: integer
          minimum: 1
          maximum: 30
          example: 4
        estado:
          $ref: '#/components/schemas/EstadoCurso'
    Curso:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/CursoRequest'
    CursoResponse:
      type: object
      required: [mensaje, datos]
      properties:
        mensaje:
          type: string
          example: Curso creado correctamente
        datos:
          $ref: '#/components/schemas/Curso'
    ListaCursosResponse:
      type: object
      required: [mensaje, datos]
      properties:
        mensaje:
          type: string
          example: Lista de cursos obtenida correctamente
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Curso'
    ApiError:
      type: object
      required: [fecha, codigo, error, mensaje, ruta, validaciones]
      properties:
        fecha:
          type: string
          format: date-time
        codigo:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        mensaje:
          type: string
          example: No existe un curso con id: 99
        ruta:
          type: string
          example: /api/cursos/99
        validaciones:
          type: object
          additionalProperties:
            type: string
